name: Publish custom LiteLLM image

on:
  push:
    branches:
      - codex/litellm-generic-video-cost-tracking
      - litellm_publish_custom_image
  workflow_dispatch:

concurrency:
  group: publish-custom-litellm-image
  cancel-in-progress: true

permissions:
  contents: read
  packages: write
  statuses: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@08eba0b27e820071cde6df949e0beb9ba4906955

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f

      - name: Log in to GitHub Container Registry
        run: |
          printf '%s' "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io \
            --username "${{ github.actor }}" \
            --password-stdin

      - name: Build and publish image
        uses: docker/build-push-action@0adf9959216b96bec444f325f1e493d4aa344497
        with:
          context: .
          file: Dockerfile
          platforms: linux/amd64
          push: true
          tags: |
            ghcr.io/hectorrguez/litellm:${{ github.sha }}
            ghcr.io/hectorrguez/litellm:video-stable
          labels: |
            org.opencontainers.image.source=https://github.com/HectorRguez/litellm
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.licenses=MIT
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Verify anonymous pull
        env:
          IMAGE: ghcr.io/hectorrguez/litellm:${{ github.sha }}
        run: |
          mkdir "$RUNNER_TEMP/anonymous-docker"
          DOCKER_CONFIG="$RUNNER_TEMP/anonymous-docker" docker manifest inspect "$IMAGE" >/dev/null

      - name: Report publication status
        if: always()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          JOB_STATUS: ${{ job.status }}
        run: |
          case "$JOB_STATUS" in
            success) STATE=success ;;
            failure) STATE=failure ;;
            cancelled) STATE=error ;;
            *) STATE=pending ;;
          esac
          jq -n \
            --arg state "$STATE" \
            --arg description "Public GHCR image publication: $JOB_STATUS" \
            --arg context "custom-litellm-image" \
            --arg target_url "https://github.com/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}" \
            '{state: $state, description: $description, context: $context, target_url: $target_url}' \
            >"$RUNNER_TEMP/publication-status.json"
          curl --fail-with-body \
            --request POST \
            --header "Accept: application/vnd.github+json" \
            --header "Authorization: Bearer $GH_TOKEN" \
            --header "X-GitHub-Api-Version: 2022-11-28" \
            --data @"$RUNNER_TEMP/publication-status.json" \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/statuses/${GITHUB_SHA}"
